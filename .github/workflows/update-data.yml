name: Update Data Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/*.xlsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl xlrd

      - name: Find Excel files
        id: find_excel
        run: |
          f1=$(ls data/VROD-registry-files*.xlsx | head -1 | xargs basename)
          f2=$(ls data/Voluntary-Registry-Offsets*.xlsx | head -1 | xargs basename)
          echo "f1=$f1" >> $GITHUB_OUTPUT
          echo "f2=$f2" >> $GITHUB_OUTPUT
          echo "File 1: $f1 | File 2: $f2"

      - name: Run build_projects.py
        env:
          VROD_EXCEL_PATH: ${{ github.workspace }}/data/${{ steps.find_excel.outputs.f1 }}
        run: python scripts/build_projects.py

      - name: Run fix_data.py
        env:
          VROD_EXCEL_PATH: ${{ github.workspace }}/data/${{ steps.find_excel.outputs.f1 }}
        run: python scripts/fix_data.py

      - name: Run enrich_projects.py
        env:
          VROD_DB_EXCEL_PATH: ${{ github.workspace }}/data/${{ steps.find_excel.outputs.f2 }}
        run: python scripts/enrich_projects.py

      - name: Commit updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --staged --quiet || git commit -m "chore: update data pipeline outputs [skip ci]"

      - name: Push changes
        run: git push
